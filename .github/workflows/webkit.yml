name: WebKit pilot

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
      - 'codex/**'
      - 'feature/**'

permissions:
  contents: read

# Pilot coverage is independent of reusable CI and release.yml: failures remain visible
# without becoming a dependency of the release/publish job.
jobs:
  webkit:
    name: System WebKit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check generated sources
        run: npm run generate:check
      - name: Build
        run: npm run build
      - name: Run system WebKit contracts and record observations
        run: npm run test:webkit -- --report-dir .output/webkit/${{ matrix.os }}
      - name: Upload observations even when a scenario fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-${{ matrix.os }}-${{ github.run_attempt }}
          path: .output/webkit/${{ matrix.os }}
          if-no-files-found: warn
